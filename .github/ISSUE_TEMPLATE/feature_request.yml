name: Feature request
description: Suggest a change to the bundle (not to the Superpowers methodology itself).
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the skills' methodology belong upstream at
        https://github.com/obra/superpowers. This repository adapts and packages them
        for DeepSeek Harness.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: A harness scenario, a session-log observation, or a test.
